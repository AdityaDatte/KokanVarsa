<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कोकण वारसा - अस्सल कोकणी स्वाद</title>
    <!-- FontAwesome & Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Marathi:wght@400;600&display=swap" rel="stylesheet">
    <!-- वेगळी CSS फाईल -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">
                <h1>कोकण वारसा</h1>
                <small style="color:gray;">अस्सल कोकणी स्वाद</small>
            </div>
            <ul class="nav-links">
                <li onclick="navigate('shop')" class="active">उत्पादने</li>
                <li onclick="navigate('cart')">कार्ट (<span id="cartCount">0</span>)</li>
            </ul>
        </div>
    </header>

    <!-- SHOP PAGE -->
    <div id="shop" class="container page-section active">
        <div class="shop-layout">
            <div class="category-sidebar">
                <h3 style="margin-top:0; border-bottom: 2px solid #eee; padding-bottom: 10px;">कॅटेगरी</h3>
                <ul class="category-list" id="categoryList">
                    <li class="active" onclick="filterProducts('All', this)">सर्व उत्पादने</li>
                    <li onclick="filterProducts('Amsul', this)">आमसूळ आणि कोकण</li>
                    <li onclick="filterProducts('Fanas', this)">फणसाचे पदार्थ</li>
                    <li onclick="filterProducts('Pith', this)">अस्सल पिठे</li>
                    <li onclick="filterProducts('Loncha', this)">घरगुती लोणची</li>
                </ul>
            </div>
            <div>
                <div class="products-grid" id="shopProductsContainer">
                    <p>डेटा लोड होत आहे... ⏳</p>
                </div>
            </div>
        </div>
    </div>

    <!-- CART PAGE -->
    <div id="cart" class="container page-section">
        <div class="cart-box">
            <h2>तुमचे शॉपिंग कार्ट</h2>
            <div id="cartItemsContainer">
                <p>कार्ट रिकामे आहे.</p>
            </div>
            <h3 style="margin-top: 20px;">एकूण: <span id="cartTotalPrice" style="color:var(--primary);">₹0</span></h3>
            
            <div style="margin-top: 20px; background: #f9f9f9; padding: 15px; border-radius: 6px;">
                <h3>डिलिव्हरी माहिती</h3>
                <form id="orderForm" action="https://kokanvarsa-backend.admin-craftee.workers.dev/order" method="POST">
                    <input type="hidden" name="order_details" id="hiddenOrderDetails">
                    <input type="hidden" name="total_amount" id="hiddenTotalAmount">
                    
                    <label style="font-size:13px; font-weight:600;">पूर्ण नाव</label>
                    <input type="text" name="customer_name" required style="width:100%; padding:10px; margin:5px 0 10px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;" placeholder="तुमचे नाव">
                    
                    <label style="font-size:13px; font-weight:600;">मोबाईल नंबर</label>
                    <input type="tel" name="phone" required style="width:100%; padding:10px; margin:5px 0 10px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;" placeholder="१० अंकी मोबाईल नंबर">
                    
                    <label style="font-size:13px; font-weight:600;">पत्ता</label>
                    <textarea name="address" rows="3" required style="width:100%; padding:10px; margin:5px 0 15px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;" placeholder="पत्ता पिनकोडसह"></textarea>
                    
                    <button type="submit" class="btn-cart" onclick="prepareOrderData()">ऑर्डर कन्फर्म करा व पेमेंट करा</button>
                </form>
            </div>
        </div>
    </div>

    <!-- वेगळी JS फाईल -->
    <script src="script.js?v=2"></script>
</body>
</html>
