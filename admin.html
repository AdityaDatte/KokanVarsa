<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokan Varsa - Admin Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Marathi:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #d35400; --bg: #f4f7f6; --text: #333; --white: #fff; }
        body { font-family: 'Noto Sans Marathi', sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--text); }
        #loginScreen { height: 100vh; display: flex; justify-content: center; align-items: center; background: #2c3e50; }
        .login-box { background: white; padding: 40px; border-radius: 12px; text-align: center; width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .login-box h2 { color: var(--primary); margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; text-align: center; font-size: 16px; }
        .login-box button { width: 100%; background: var(--primary); color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        #dashboardArea { display: none; }
        .sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; padding: 20px; position: fixed; box-sizing: border-box; }
        .sidebar h2 { color: var(--primary); font-size: 24px; text-align: center; border-bottom: 1px solid #34495e; padding-bottom: 15px; margin-top: 10px; }
        .sidebar p { text-align: center; font-size: 14px; color: #bdc3c7; margin-bottom: 30px; }
        .nav-item { padding: 12px 15px; margin-bottom: 10px; background: #34495e; border-radius: 8px; cursor: pointer; }
        .main { margin-left: 250px; padding: 30px; width: calc(100% - 250px); box-sizing: border-box; }
        .insights { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { background: var(--white); padding: 20px; border-radius: 10px; flex: 1; display: flex; align-items: center; gap: 20px; border-left: 5px solid var(--primary); }
        .card i { font-size: 32px; color: var(--primary); background: #fbeee6; padding: 15px; border-radius: 50%; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .box { background: var(--white); padding: 25px; border-radius: 10px; }
        label { font-size: 13px; font-weight: 600; color: #555; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-orange { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px 12px; text-align: left; border-bottom: 1px solid #eee; }
        td img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
        .unit-badge { background: #e8f4f8; color: #2980b9; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .btn-delete { background: #e74c3c; color: white; padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; width: auto; margin: 0; }
        .btn-edit { background: #f39c12; color: white; padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; width: auto; margin-right: 5px; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <h2><i class="fas fa-lock"></i> ॲडमिन लॉगिन</h2>
            <p style="font-size: 14px; color: #666;">केवळ अधिकृत व्यक्तींसाठी</p>
            <input type="password" id="adminPassword" placeholder="पासवर्ड टाका">
            <button onclick="checkLogin()">लॉगिन करा</button>
            <p id="loginError" style="color: red; font-size: 14px; margin-top: 15px; display: none;">चुकीचा पासवर्ड!</p>
        </div>
    </div>

    <div id="dashboardArea">
        <div class="sidebar">
            <h2>कोकण वारसा</h2>
            <p>स्वागत आहे! 👨‍💻</p>
            <div style="margin-top: 40px;">
                <div class="nav-item" style="background: var(--primary);"><i class="fas fa-box-open" style="margin-right: 10px;"></i> उत्पादने</div>
                <div class="nav-item" onclick="logout()" style="background: #e74c3c; margin-top: auto;"><i class="fas fa-sign-out-alt" style="margin-right: 10px;"></i> लॉग आउट</div>
            </div>
        </div>

        <div class="main">
            <div class="header" style="margin-bottom: 30px;"><h1 style="margin: 0; font-size: 28px;">प्रॉडक्ट मॅनेजमेंट ⚙️</h1></div>
            
            <div class="insights">
                <div class="card"><i class="fas fa-boxes"></i><div class="card-info"><h3 id="totalProductsCount">0</h3><p>एकूण उत्पादने</p></div></div>
                <div class="card"><i class="fas fa-tags"></i><div class="card-info"><h3 id="avgPriceCount">₹0</h3><p>सरासरी किंमत</p></div></div>
            </div>

            <div class="dashboard-grid">
                <!-- फॉर्म जिथे आता कॅटेगरी पण आहे -->
                <div class="box">
                    <h3 style="margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px;"><i class="fas fa-plus-circle"></i> प्रॉडक्ट माहिती</h3>
                    <form id="addProductForm">
                        <label>नाव</label>
                        <input type="text" id="name" required placeholder="उदा. हापूस आंबा">
                        
                        <label>किंमत (₹)</label>
                        <input type="number" id="price" required placeholder="उदा. १२००">
                        
                        <label>प्रमाण (Unit)</label>
                        <select id="unit">
                            <option value="१ किलो">१ किलो</option>
                            <option value="५०० ग्रॅम">५०० ग्रॅम</option>
                            <option value="२५० ग्रॅम">२५० ग्रॅम</option>
                            <option value="१ लिटर">१ लिटर</option>
                            <option value="१ डझन">१ डझन</option>
                            <option value="१ नग">१ नग</option>
                        </select>

                        <!-- ही नवीन कॅटेगरी इथे आहे -->
                       <label>कॅटेगरी (Category)</label>
<select id="category">
    <option value="Amsul">आमसूळ आणि कोकण</option>
    <option value="Fanas">फणसाचे पदार्थ</option>
    <option value="Pith">अस्सल पिठे</option>
    <option value="Loncha">घरगुती लोणची</option>
    <option value="All">इतर</option>
</select>

                        <label>फोटोची लिंक</label>
                        <input type="text" id="image_url" required placeholder="उदा. mango.jpg">
                        
                        <button type="submit" id="submitBtn" class="btn-orange">सेव्ह करा</button>
                    </form>
                    <p id="statusMsg" style="text-align: center; font-size: 14px; margin-top: 10px;"></p>
                </div>

                <!-- प्रॉडक्ट लिस्ट आणि टेबल -->
                <div class="box">
                    <h3 style="margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px;"><i class="fas fa-list"></i> दुकानातील उत्पादने</h3>
                    <div style="overflow-x: auto;">
                        <table>
                            <thead><tr><th>फोटो</th><th>नाव</th><th>किंमत</th><th>प्रमाण व कॅटेगरी</th><th>ॲक्शन</th></tr></thead>
                            <tbody id="productListArea"><tr><td colspan="5" style="text-align:center;">डेटा लोड होत आहे... ⏳</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- सिक्युरिटी, Add, Delete आणि Edit चा जावास्क्रिप्ट कोड -->
    <script>
        const API_URL = "https://kokanvarsa-backend.admin-craftee.workers.dev";
        let savedPassword = sessionStorage.getItem("adminPass");
        let editingProductId = null;

        async function checkLogin() {
            const passInput = document.getElementById('adminPassword').value;
            const btn = document.querySelector('.login-box button');
            btn.innerText = "चेक करत आहे... ⏳";
            try {
                const res = await fetch(`${API_URL}/verify-admin`, { method: "POST", headers: { "x-admin-pass": passInput } });
                if (res.ok) {
                    sessionStorage.setItem("adminPass", passInput);
                    savedPassword = passInput;
                    document.getElementById('loginScreen').style.display = "none";
                    document.getElementById('dashboardArea').style.display = "flex";
                    loadAdminProducts();
                } else {
                    document.getElementById('loginError').style.display = "block";
                    btn.innerText = "लॉगिन करा";
                }
            } catch (error) {
                document.getElementById('loginError').innerText = "सर्व्हरशी संपर्क तुटला!";
                document.getElementById('loginError').style.display = "block";
                btn.innerText = "लॉगिन करा";
            }
        }

        if (savedPassword) {
            document.getElementById('loginScreen').style.display = "none";
            document.getElementById('dashboardArea').style.display = "flex";
            loadAdminProducts();
        }

        function logout() { sessionStorage.removeItem("adminPass"); location.reload(); }

        async function loadAdminProducts() {
            const res = await fetch(`${API_URL}/products`, { cache: "no-store" });
            const products = await res.json();
            const area = document.getElementById('productListArea');
            area.innerHTML = "";
            document.getElementById('totalProductsCount').innerText = products.length;
            
            let totalPrice = 0;
            if (products.length === 0) area.innerHTML = "<tr><td colspan='5' style='text-align:center;'>प्रॉडक्ट नाही.</td></tr>";
            else {
                products.forEach(p => {
                    totalPrice += p.price;
                    area.innerHTML += `<tr>
                        <td><img src="${p.image_url}" alt="${p.name}"></td>
                        <td style="font-weight: 600;">${p.name}</td>
                        <td style="color: var(--primary); font-weight: bold;">₹${p.price}</td>
                        <td>
                            <span class="unit-badge">${p.unit || '१ नग'}</span> <br>
                            <small style="color:gray; font-weight:bold; margin-top:5px; display:inline-block;">${p.category || 'All'}</small>
                        </td>
                        <td>
                            <button class="btn-edit" onclick="editProduct(${p.id}, '${p.name}', ${p.price}, '${p.unit}', '${p.category}', '${p.image_url}')" title="Edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-delete" onclick="deleteProduct(${p.id})" title="Delete"><i class="fas fa-trash-alt"></i></button>
                        </td>
                    </tr>`;
                });
            }
            document.getElementById('avgPriceCount').innerText = `₹${products.length > 0 ? Math.round(totalPrice / products.length) : 0}`;
        }

        // Edit फंक्शन
        function editProduct(id, name, price, unit, category, img) {
    editingProductId = id; // हा ID सेव्ह होणे अत्यंत महत्त्वाचे आहे
    document.getElementById('name').value = name;
    document.getElementById('price').value = price;
    document.getElementById('unit').value = unit || '१ नग';
    document.getElementById('category').value = category || 'All';
    document.getElementById('image_url').value = img;

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = "अपडेट करा 🔄";
    submitBtn.style.background = "#27ae60"; 
    window.scrollTo({ top: 0, behavior: 'smooth' }); 
}

        // सेव्ह / अपडेट करणे
        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = "सेव्ह होत आहे... ⏳"; btn.disabled = true;
            
            const url = editingProductId ? `${API_URL}/edit-product` : `${API_URL}/add-product`;
            const method = editingProductId ? "PUT" : "POST";
            
            const res = await fetch(url, {
                method: method, 
                headers: { "Content-Type": "application/json", "x-admin-pass": savedPassword },
                body: JSON.stringify({
                    id: editingProductId,
                    name: document.getElementById('name').value,
                    price: document.getElementById('price').value,
                    unit: document.getElementById('unit').value,
                    category: document.getElementById('category').value, // इथून कॅटेगरी पास होईल
                    image_url: document.getElementById('image_url').value,
                    stock_status: "In Stock"
                })
            });
            
            if(res.ok) {
                document.getElementById('statusMsg').innerHTML = `<span style='color: green;'>प्रॉडक्ट ${editingProductId ? 'अपडेट' : 'ॲड'} झाले! 🎉</span>`;
                this.reset();
                editingProductId = null; 
                btn.innerText = "सेव्ह करा"; 
                btn.style.background = "var(--primary)";
                loadAdminProducts();
            } else {
                document.getElementById('statusMsg').innerHTML = "<span style='color: red;'>एरर आला आहे!</span>";
                btn.innerText = editingProductId ? "अपडेट करा 🔄" : "सेव्ह करा";
            }
            btn.disabled = false;
        });

        // डिलीट करणे
        async function deleteProduct(id) {
            if(confirm("नक्की काढून टाकायचे?")) {
                await fetch(`${API_URL}/delete-product?id=${id}`, { method: "DELETE", headers: { "x-admin-pass": savedPassword } });
                loadAdminProducts();
            }
        }
    </script>
</body>
</html>
