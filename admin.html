<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Kokan Varsa</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Marathi:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Marathi', sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .admin-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #d35400; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 5px; color: #333; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #d35400; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #b04600; }
        #statusMsg { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2>कोकण वारसा - Admin ⚙️</h2>
        <form id="addProductForm">
            <label>प्रॉडक्टचे नाव:</label>
            <input type="text" id="name" required placeholder="उदा. सांडगे (५०० ग्रॅम)">

            <label>किंमत (₹):</label>
            <input type="number" id="price" required placeholder="उदा. 200">

            <label>फोटोची लिंक (किंवा फाईलचे नाव):</label>
            <input type="text" id="image_url" required placeholder="उदा. sandge.jpg किंवा फोटोची लिंक">

            <button type="submit">नवीन प्रॉडक्ट ॲड करा</button>
        </form>
        <p id="statusMsg"></p>
    </div>

    <script>
        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            btn.innerText = "डेटाबेसमध्ये सेव्ह होत आहे... ⏳";
            btn.disabled = true;

            // फॉर्ममधला डेटा गोळा करणे
            const productData = {
                name: document.getElementById('name').value,
                price: document.getElementById('price').value,
                image_url: document.getElementById('image_url').value,
                stock_status: "In Stock"
            };

            try {
                // बॅकएंडला डेटा पाठवणे
                const response = await fetch("https://kokanvarsa-backend.admin-craftee.workers.dev/add-product", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(productData)
                });

                const result = await response.json();
                
                if(result.success) {
                    document.getElementById('statusMsg').innerHTML = "<span style='color: green;'>प्रॉडक्ट यशस्वीरित्या दुकानात ॲड झाले! 🎉</span>";
                    this.reset(); // फॉर्म रिकामा करणे
                } else {
                    document.getElementById('statusMsg').innerHTML = "<span style='color: red;'>काहीतरी चूक झाली!</span>";
                }
            } catch(error) {
                document.getElementById('statusMsg').innerHTML = "<span style='color: red;'>सर्व्हर एरर! इंटरनेट तपासा.</span>";
            }
            
            btn.innerText = "नवीन प्रॉडक्ट ॲड करा";
            btn.disabled = false;
        });
    </script>
</body>
</html>
