<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>उत्पादने - कोकण वारसा</title>
    <link rel="stylesheet" href="style.css?v=8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="nav-container">
            
            <!-- Logo Area -->
            <div class="logo-area" onclick="location.href='index.html'" style="cursor: pointer; display: flex; align-items: center;">
                <img src="https://atafmexkgyqalxbrexju.supabase.co/storage/v1/object/public/product-images/logo.jpeg" alt="कोकण वारसा" style="height: 48px; width: auto; object-fit: contain; border-radius: 6px;">
            </div>

            <!-- Navigation Links -->
            <ul class="nav-links">
                <li><a href="index.html" style="color:inherit; text-decoration:none;">होम</a></li>
                <li><a href="products.html" class="active" style="color:var(--primary); text-decoration:none;">उत्पादने</a></li>
                <li><a href="#about" onclick="navigate('about')" style="color:inherit; text-decoration:none;">आमच्याबद्दल</a></li>
                <li><a href="#contact" onclick="navigate('contact')" style="color:inherit; text-decoration:none;">संपर्क</a></li>
            </ul>

            <!-- Navigation Icons (Search, Cart & Language Toggle) -->
            <div class="nav-icons" style="display: flex; gap: 12px; align-items: center;">
                
                <!-- Language Toggle Button -->
                <button onclick="toggleLanguage()" id="langBtn" style="background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px;">
                    English
                </button>

                <!-- Search Input -->
                <input type="text" id="searchInput" placeholder="उत्पादने शोधा..." oninput="handleSearch(this.value)" style="padding: 8px 12px; border-radius: 20px; border: 1px solid #ddd; outline: none; font-size: 13px; width: 130px;">
                
                <!-- Cart Icon -->
                <div class="cart-icon-wrapper" onclick="navigate('cart')" style="cursor: pointer; position: relative; font-size: 18px;">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" id="cartCount">0</span>
                </div>

            </div>

        </div>
    </header>

    <!-- Main Products & Cart Section -->
    <main class="container" style="padding: 40px 20px;">
        <h2 style="margin-bottom: 20px;" id="pageMainHeading">आमची उत्पादने</h2>
        
        <!-- Products Container -->
        <div id="shopProductsContainer" class="products-grid">
            <!-- Products will be loaded dynamically via script.js -->
        </div>

        <!-- Cart Section -->
        <div id="cart" style="margin-top: 50px; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
            <h3 id="cartSectionTitle" style="margin-bottom: 15px;">तुमचे शॉपिंग कार्ट</h3>
            <div id="cartItemsContainer">
                <p id="cartEmptyText">कार्ट रिकामे आहे.</p>
            </div>
            <div id="cartTotalContainer" style="margin-top: 20px; font-weight: bold; font-size: 18px;">
                <span id="totalLabel">एकूण रक्कम:</span> ₹<span id="cartTotalPrice">0</span>
            </div>

            <!-- Order Form -->
            <form id="orderForm" style="margin-top: 25px; display: flex; flex-direction: column; gap: 15px; max-width: 500px;">
                <h4 id="deliveryInfoHeading">डिलिव्हरी माहिती व पत्ता</h4>
                <input type="text" name="customer_name" placeholder="तुमचे नाव" required style="padding: 10px; border-radius: 6px; border: 1px solid #ddd;">
                <input type="tel" name="customer_phone" placeholder="१० अंकी मोबाईल नंबर" required style="padding: 10px; border-radius: 6px; border: 1px solid #ddd;">
                <textarea name="customer_address" placeholder="पत्ता पिनकोडसह" rows="3" required style="padding: 10px; border-radius: 6px; border: 1px solid #ddd;"></textarea>
                
                <button type="submit" id="orderSubmitBtn" style="background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px;">
                    ऑर्डर कन्फर्म करा व पेमेंट करा
                </button>
            </form>
        </div>
    </main>

    <!-- Script File with Version Update -->
    <script src="script.js?v=9"></script>
</body>
</html>
